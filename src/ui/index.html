<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Valet : your personal algorithm</title>
  <!-- FOUC prevention script per modern-web-guidance dark-mode-toggle & font-scaling -->
  <script>
    try {
      const stored = localStorage.getItem("valet-color-scheme");
      if (stored === "light" || stored === "dark") {
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = stored;
        document.documentElement.setAttribute("data-theme", stored);
        document.documentElement.setAttribute("data-color-scheme", stored);
        document.documentElement.style.colorScheme = stored;
      }
      const fontScale = localStorage.getItem("valet-font-scale");
      if (fontScale === "medium" || fontScale === "large") {
        document.documentElement.setAttribute("data-font-size", fontScale);
      }
    } catch (e) { }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
</body>

</html>
